<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot ผู้ช่วยอัจฉริยะ</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 360px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mascot-stage {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .robot-svg {
      width: 130px;
      height: 130px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .eye {
      transform-origin: center;
      animation: blink 4s infinite;
    }

    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.1); }
    }

    .talking .mouth {
      animation: talk 0.25s infinite alternate;
    }

    @keyframes talk {
      0% { rx: 12; ry: 3; }
      100% { rx: 14; ry: 10; }
    }

    .status-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 12px;
      margin-top: 8px;
    }

    .chat-box {
      height: 240px;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.4;
    }

    .msg.bot {
      background: #f1f5f9;
      color: #1e293b;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: #4f46e5;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #e2e8f0;
      gap: 8px;
    }

    input {
      flex: 1;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      padding: 8px 15px;
      outline: none;
      font-size: 14px;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #94a3b8;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="mascot-stage">
    <svg id="mascot" class="robot-svg" viewBox="0 0 200 200">
      <line x1="100" y1="35" x2="100" y2="15" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <circle id="antenna-light" cx="100" cy="15" r="8" fill="#fbbf24"/>
      <rect x="25" y="75" width="15" height="40" rx="7" fill="#cbd5e1"/>
      <rect x="160" y="75" width="15" height="40" rx="7" fill="#cbd5e1"/>
      <rect x="40" y="35" width="120" height="105" rx="30" fill="#ffffff"/>
      <rect x="55" y="55" width="90" height="65" rx="18" fill="#1e293b"/>
      <circle class="eye" cx="80" cy="82" r="9" fill="#38bdf8"/>
      <circle class="eye" cx="120" cy="82" r="9" fill="#38bdf8"/>
      <ellipse class="mouth" cx="100" cy="105" rx="12" ry="3" fill="#38bdf8"/>
      <path d="M65 148 Q100 140 135 148 L145 185 L55 185 Z" fill="#ffffff"/>
    </svg>
    <div>
      <span id="status-text" class="status-badge">พร้อมพูดคุยครับ</span>
    </div>
  </div>

  <div class="chat-box" id="chat-box">
    <div class="msg bot">สวัสดีครับ มีอะไรให้ผมช่วยไหมครับ พิมพ์ถามได้เลยนะ</div>
  </div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="พิมพ์ข้อความที่นี่..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="send-btn" onclick="sendMessage()">ส่ง</button>
  </div>
</div>

<script>
  // นำ URL เว็บแอปจาก Google Apps Script มาวางที่นี่
  const GAS_API_URL = "ใส่_URL_ของ_GOOGLE_APPS_SCRIPT_ที่นี่";

  const mascot = document.getElementById('mascot');
  const statusText = document.getElementById('status-text');
  const antennaLight = document.getElementById('antenna-light');
  const chatBox = document.getElementById('chat-box');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'th-TH';
      utterance.rate = 1.05;
      utterance.pitch = 1.1;

      utterance.onstart = () => {
        mascot.classList.add('talking');
        statusText.innerText = 'กำลังพูด...';
        antennaLight.setAttribute('fill', '#34d399');
      };

      utterance.onend = () => {
        mascot.classList.remove('talking');
        statusText.innerText = 'พร้อมพูดคุยครับ';
        antennaLight.setAttribute('fill', '#fbbf24');
      };

      window.speechSynthesis.speak(utterance);
    }
  }

  function appendMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.innerText = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    if ('speechSynthesis' in window && window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }

    appendMessage(text, 'user');
    userInput.value = '';
    userInput.disabled = true;
    sendBtn.disabled = true;

    statusText.innerText = 'กำลังคิดคำตอบ...';
    antennaLight.setAttribute('fill', '#f43f5e');

    try {
      // ส่งข้อมูลไปยัง Google Apps Script แบบ text/plain เพื่อหลีกเลี่ยงปัญหา CORS Preflight
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({ message: text })
      });

      const data = await response.json();
      appendMessage(data.reply, 'bot');
      speakText(data.reply);

    } catch (error) {
      appendMessage('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + error.message, 'bot');
      statusText.innerText = 'พร้อมพูดคุยครับ';
      antennaLight.setAttribute('fill', '#fbbf24');
    } finally {
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }
</script>

</body>
</html>
